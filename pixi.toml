[workspace]
name = "shou-what-to-eat"
version = "0.1.0"
description = "今日海大吃什么：静态餐饮站和 Cloudflare 投稿审核服务"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
nodejs = ">=20,<27"
pnpm = ">=9,<11"

[tasks]
install = "pnpm install --frozen-lockfile"
dev = "pnpm dev"
build = "pnpm build"
preview = "pnpm preview"
typecheck = "pnpm typecheck"
test = "pnpm test"
catalog-prepare = "pnpm catalog:prepare"
predeploy-check = "pnpm predeploy:check"
config-check = "pnpm config:check"
workers-dev = "pnpm worker:dev"
workers-deploy = "pnpm worker:deploy"
workers-deploy-preview = "pnpm worker:deploy:preview"
d1-migrate-local = "pnpm d1:migrate:local"
d1-migrate-preview = "pnpm d1:migrate:preview"
d1-migrate-remote = "pnpm d1:migrate:production"
