name: Deploy preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check preview deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_PREVIEW_D1_DATABASE_ID }}
          CI: true
        run: node scripts/check-cloudflare-env.mjs --environment preview --ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ''
      - run: pnpm worker:deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_PREVIEW_D1_DATABASE_ID }}
          CLOUDFLARE_PREVIEW_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_PREVIEW_R2_BUCKET_NAME || secrets.CLOUDFLARE_PREVIEW_R2_BUCKET_NAME }}
          MEDIA_MODE: ${{ vars.MEDIA_MODE || 'r2' }}
