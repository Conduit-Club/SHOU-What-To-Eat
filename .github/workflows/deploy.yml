name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check production deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          CI: true
        run: node scripts/check-cloudflare-env.mjs --environment production --ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm worker:deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED || 'false' }}
      - name: Record deployed content
        if: ${{ env.PUBLICATION_ENABLED == 'true' }}
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          DEPLOY_BODY="{\"commit\":\"${DEPLOY_COMMIT}\"}"
          DEPLOY_SIGNATURE="sha256=$(printf %s "$DEPLOY_BODY" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" -hex | sed 's/^.* //')"
          curl --fail-with-body --request POST "$DEPLOY_WEBHOOK_URL" --header 'Content-Type: application/json' --header "X-Deploy-Signature: $DEPLOY_SIGNATURE" --data "$DEPLOY_BODY"
